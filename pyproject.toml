[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bersihin-cli"
version = "2.0.1"
description = "Safe cross-platform cache and temporary-file cleaner for Windows, Linux, Termux, WSL and macOS."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Baska ID" }]
keywords = ["cleaner", "cache", "termux", "linux", "windows", "wsl", "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
bersihin = "bersihin:main"

[tool.setuptools]
py-modules = ["bersihin"]
